<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Marker Trainer - Prototype</title>
<style>
  :root {
    --bg: #F7F5F0;
    --surface: #FFFFFF;
    --ink: #1A1A1A;
    --ink-soft: #4A4A4A;
    --ink-muted: #8A857D;
    --line: #E4DFD5;
    --line-soft: #EFEBE2;
    --accent: #2C6E7F;
    --accent-soft: #E4EEF1;
    --correct: #4E7A3B;
    --correct-soft: #E8F0DE;
    --wrong: #A64545;
    --wrong-soft: #F4E3E1;
    --shadow: 0 1px 2px rgba(20, 20, 20, 0.04), 0 2px 8px rgba(20, 20, 20, 0.03);
    --font-jp: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', sans-serif;
    --font-en: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-jp);
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    min-height: 100vh;
    padding: 0;
  }

  .app {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 20px 80px;
    min-height: 100vh;
  }

  header.top {
    padding: 20px 0 12px;
    border-bottom: 1px solid var(--line-soft);
    margin-bottom: 24px;
  }

  .brand {
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--ink-muted);
    text-transform: uppercase;
    font-weight: 600;
  }

  .brand-name {
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
    margin-top: 4px;
    letter-spacing: -0.01em;
  }

  .brand-sub {
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 4px;
  }

  /* ===== Setup screen ===== */

  .setup-section {
    margin-bottom: 28px;
  }

  .setup-section h2 {
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--ink-muted);
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 12px;
  }

  .preset-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }

  .preset-btn {
    padding: 14px 12px;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
  }

  .preset-btn:hover { border-color: var(--accent); }

  .preset-btn.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }

  .preset-btn small {
    display: block;
    font-size: 11px;
    color: var(--ink-muted);
    margin-top: 3px;
    font-weight: 400;
  }

  .preset-btn.active small { color: var(--accent); opacity: 0.8; }

  .tags-detail {
    margin-top: 16px;
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.7;
  }

  .tags-detail .cat {
    font-weight: 600;
    color: var(--ink);
    margin-right: 6px;
  }

  .idiom-note {
    margin-top: 16px;
    padding: 12px 14px;
    background: transparent;
    border-left: 3px solid var(--line);
    font-size: 12px;
    color: var(--ink-muted);
    line-height: 1.6;
  }

  .primary-btn {
    display: block;
    width: 100%;
    padding: 16px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    margin-top: 28px;
    transition: opacity 0.15s;
  }

  .primary-btn:hover { opacity: 0.9; }
  .primary-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ===== Question screen ===== */

  .progress {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    font-size: 12px;
    color: var(--ink-muted);
    letter-spacing: 0.05em;
    font-weight: 500;
  }

  .progress-count { font-weight: 700; color: var(--ink-soft); }

  .progress-bar {
    height: 3px;
    background: var(--line-soft);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 20px;
  }

  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.3s ease;
  }

  .tag-chip {
    display: inline-block;
    font-size: 11px;
    padding: 3px 8px;
    background: var(--line-soft);
    color: var(--ink-muted);
    border-radius: 4px;
    letter-spacing: 0.03em;
    font-weight: 500;
    margin-bottom: 12px;
  }

  .context-en {
    font-family: var(--font-en);
    font-size: 14px;
    color: var(--ink-muted);
    font-style: italic;
    padding: 10px 14px;
    background: var(--surface);
    border-left: 3px solid var(--line);
    border-radius: 0 6px 6px 0;
    margin-bottom: 16px;
    line-height: 1.5;
  }

  .context-label {
    display: block;
    font-size: 10px;
    color: var(--ink-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 4px;
    font-style: normal;
  }

  .ja-sentence {
    font-size: 17px;
    color: var(--ink);
    font-weight: 500;
    margin-bottom: 8px;
    line-height: 1.55;
  }

  .en-template {
    font-family: var(--font-en);
    font-size: 20px;
    color: var(--ink);
    padding: 20px 18px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 24px;
    line-height: 1.5;
    letter-spacing: 0;
  }

  .blank {
    display: inline-block;
    min-width: 90px;
    text-align: center;
    padding: 2px 8px;
    background: var(--accent-soft);
    color: var(--accent);
    border-bottom: 2px solid var(--accent);
    border-radius: 3px 3px 0 0;
    font-weight: 700;
    margin: 0 2px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    font-family: var(--font-en);
    font-size: 16px;
    color: var(--ink);
    cursor: pointer;
    text-align: left;
    transition: all 0.12s;
    width: 100%;
  }

  .option-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .option-btn:disabled { cursor: default; }

  .option-key {
    font-family: var(--font-jp);
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-muted);
    background: var(--line-soft);
    padding: 3px 7px;
    border-radius: 4px;
    letter-spacing: 0.05em;
    flex-shrink: 0;
  }

  .option-text { flex: 1; }

  /* ===== Reviewed state ===== */

  .option-btn.reviewed {
    padding: 14px 16px 16px;
    align-items: flex-start;
    flex-direction: column;
    gap: 0;
    cursor: default;
  }

  .option-btn.correct {
    background: var(--correct-soft);
    border-color: var(--correct);
  }

  .option-btn.wrong {
    background: var(--wrong-soft);
    border-color: var(--wrong);
  }

  .option-btn.wrong-picked {
    background: var(--wrong-soft);
    border-color: var(--wrong);
    box-shadow: 0 0 0 2px var(--wrong-soft), 0 0 0 3px var(--wrong);
  }

  .option-btn.correct-picked {
    background: var(--correct-soft);
    border-color: var(--correct);
    box-shadow: 0 0 0 2px var(--correct-soft), 0 0 0 3px var(--correct);
  }

  .review-header {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    margin-bottom: 10px;
  }

  .badge {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .badge.correct { background: var(--correct); color: white; }
  .badge.wrong { background: var(--wrong); color: white; }

  .review-body {
    width: 100%;
    padding-left: 32px;
    font-family: var(--font-jp);
    font-size: 13px;
    line-height: 1.6;
  }

  .review-reason {
    color: var(--ink);
    margin-bottom: 6px;
  }

  .review-reason strong {
    display: block;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--ink-muted);
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 2px;
  }

  .review-note {
    color: var(--ink-soft);
    font-size: 12px;
    margin-bottom: 8px;
    padding-left: 8px;
    border-left: 2px solid var(--line);
  }

  .review-applied {
    color: var(--ink);
    background: rgba(255, 255, 255, 0.6);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 12px;
  }

  .review-applied strong {
    display: block;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--ink-muted);
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 3px;
  }

  .next-bar {
    position: sticky;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 16px 0 20px;
    margin-top: 16px;
    background: linear-gradient(to top, var(--bg) 60%, transparent);
  }

  /* ===== Result screen ===== */

  .result-summary {
    text-align: center;
    padding: 32px 24px;
    background: var(--surface);
    border-radius: 14px;
    border: 1px solid var(--line-soft);
    margin-bottom: 24px;
  }

  .result-score {
    font-family: var(--font-en);
    font-size: 56px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .result-score-total {
    font-size: 20px;
    color: var(--ink-muted);
    font-weight: 500;
  }

  .result-label {
    font-size: 12px;
    color: var(--ink-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 8px;
    font-weight: 600;
  }

  .category {
    background: var(--surface);
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    margin-bottom: 8px;
    overflow: hidden;
  }

  .category-head {
    display: flex;
    align-items: center;
    padding: 14px 16px;
    cursor: pointer;
    gap: 12px;
    transition: background 0.12s;
  }

  .category-head:hover { background: var(--line-soft); }

  .category-name {
    flex: 1;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
  }

  .category-bar {
    width: 90px;
    height: 5px;
    background: var(--line-soft);
    border-radius: 3px;
    overflow: hidden;
  }

  .category-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
  }

  .category-score {
    font-family: var(--font-en);
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    min-width: 42px;
    text-align: right;
  }

  .category-caret {
    color: var(--ink-muted);
    transition: transform 0.15s;
    font-size: 10px;
  }

  .category.open .category-caret { transform: rotate(180deg); }

  .category-detail {
    padding: 0 16px 14px;
    border-top: 1px solid var(--line-soft);
    display: none;
  }

  .category.open .category-detail { display: block; }

  .tag-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    font-size: 13px;
  }

  .tag-name { flex: 1; color: var(--ink-soft); }

  .tag-score {
    font-family: var(--font-en);
    font-size: 12px;
    color: var(--ink-muted);
  }

  .action-bar {
    display: flex;
    gap: 10px;
    margin-top: 28px;
  }

  .secondary-btn {
    flex: 1;
    padding: 14px;
    background: var(--surface);
    color: var(--ink);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }

  .secondary-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* MD Export modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 20, 20, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
  }

  .modal {
    background: var(--surface);
    border-radius: 14px;
    padding: 24px;
    max-width: 520px;
    width: 100%;
    max-height: 80vh;
    overflow: auto;
  }

  .modal h3 {
    font-size: 16px;
    margin-bottom: 14px;
  }

  .modal textarea {
    width: 100%;
    height: 300px;
    padding: 12px;
    font-family: 'SF Mono', Consolas, monospace;
    font-size: 11px;
    line-height: 1.5;
    border: 1px solid var(--line);
    border-radius: 8px;
    resize: vertical;
    background: var(--bg);
    color: var(--ink);
  }

  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    justify-content: flex-end;
  }

  /* Screen transitions */
  .screen {
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 400px) {
    .app { padding: 0 16px 60px; }
    .en-template { font-size: 17px; padding: 16px 14px; }
    .result-score { font-size: 44px; }
    .preset-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
// ============================================================
// Mock data - 10 items covering all major tags
// ============================================================
const MOCK_SET = {
  generatedAt: "2026-07-10T00:00:00Z",
  preset: "ミックス診断",
  selectedTags: ["N-NP","N-UNC","N-QNT","V-TA","V-VOICE","V-MOD-DYN","V-MOD-DEO","M-AGR","M-PRON-CASE","M-SEQ"],
  tagAllocation: ["N-NP","N-UNC","N-QNT","V-TA","V-VOICE","V-MOD-DYN","V-MOD-DEO","M-AGR","M-PRON-CASE","M-SEQ"],
  items: [
    {
      id: 1, tag: "N-NP", sceneTag: "買い物", functionTag: "情報を得る",
      contextEn: "I was looking for a gift.",
      ja: "昨日、私は書店に行った。",
      template: "I went to ___ yesterday.",
      options: [
        { key: "A", text: "a bookstore", correct: true, reasonCode: null, note: null, appliedMeaning: null },
        { key: "B", text: "the bookstore", correct: false, reasonCode: "N_DEF_NEW", note: "どの書店かは初めて話題に出る", appliedMeaning: "（相手がすでに知っている）例の書店に行った、という意味になる" },
        { key: "C", text: "bookstores", correct: false, reasonCode: "N_NUM_SG", note: "行ったのは1軒", appliedMeaning: "複数の書店を（同時に／はしごして）回った、という意味になる" },
        { key: "D", text: "the bookstores", correct: false, reasonCode: "N_DEF_NEW", note: "限定性・数の両方が不適", appliedMeaning: "相手も知っている複数の書店を回った、という意味になる" }
      ]
    },
    {
      id: 2, tag: "N-UNC", sceneTag: "空港", functionTag: "確認する",
      contextEn: "The waiter is asking what she wants to drink.",
      ja: "水をください。",
      template: "I'd like some ___, please.",
      options: [
        { key: "A", text: "water", correct: true, reasonCode: null, note: null, appliedMeaning: null },
        { key: "B", text: "a water", correct: false, reasonCode: "N_UNCOUNTABLE", note: "water は不可算名詞なので a は付かない", appliedMeaning: "文法的に成立せず、意味が確定しない（口語で「1杯の水」と伝わる場合もあるが正式には非文法）" },
        { key: "C", text: "waters", correct: false, reasonCode: "N_UNCOUNTABLE", note: "-s は付かない（複数の水域を意味する別語）", appliedMeaning: "「複数の海域・領海」という意味に変わってしまう" },
        { key: "D", text: "the water", correct: false, reasonCode: "N_DEF_NEW", note: "特定の水を指す文脈ではない", appliedMeaning: "話し手と聞き手の間で共通認識のある特定の水を指す意味になる" }
      ]
    },
    {
      id: 3, tag: "N-QNT", sceneTag: "教室", functionTag: "情報を得る",
      contextEn: null,
      ja: "宿題はあまり多くない。",
      template: "I don't have ___ homework.",
      options: [
        { key: "A", text: "much", correct: true, reasonCode: null, note: null, appliedMeaning: null },
        { key: "B", text: "many", correct: false, reasonCode: "N_QNT_MISMATCH", note: "homework は不可算なので many は使えない", appliedMeaning: "文法的に成立しない（many は可算名詞専用）" },
        { key: "C", text: "few", correct: false, reasonCode: "N_QNT_MISMATCH", note: "few も可算専用", appliedMeaning: "文法的に成立しない" },
        { key: "D", text: "little", correct: false, reasonCode: "V_MOD_TOO_STRONG", note: "little は否定文と重ねると『少しはある』の意味が壊れる", appliedMeaning: "『ほぼゼロの宿題を持っていない』という不自然な二重否定になる" }
      ]
    },
    {
      id: 4, tag: "V-TA", sceneTag: "職場", functionTag: "情報を得る",
      contextEn: "The phone rang at 8pm.",
      ja: "電話が鳴ったとき、私は夕食を食べていた。",
      template: "I ___ dinner when the phone rang.",
      options: [
        { key: "A", text: "was eating", correct: true, reasonCode: null, note: null, appliedMeaning: null },
        { key: "B", text: "ate", correct: false, reasonCode: "V_ASPECT", note: "電話が鳴った瞬間に食事の途中であった継続を表せない", appliedMeaning: "食べたという1回の完結した行為になり、電話との時間関係が同時ではなくなる" },
        { key: "C", text: "have eaten", correct: false, reasonCode: "V_TENSE", note: "現在完了で過去の1点との重ねができない", appliedMeaning: "「今までに食べたことがある」という現在時点での経験の意味になる" },
        { key: "D", text: "had eaten", correct: false, reasonCode: "V_ASPECT", note: "過去完了だと『電話が鳴る前にすでに食べ終わっていた』になり継続でない", appliedMeaning: "電話が鳴る前に食事が完了していた、という順序の意味になる" }
      ]
    },
    {
      id: 5, tag: "V-VOICE", sceneTag: "語学学校", functionTag: "確認する",
      contextEn: "The teacher assigned the report to the class.",
      ja: "そのレポートは金曜日までに書かれる必要がある。",
      template: "The report ___ by Friday.",
      options: [
        { key: "A", text: "must be written", correct: true, reasonCode: null, note: null, appliedMeaning: null },
        { key: "B", text: "must write", correct: false, reasonCode: "V_VOICE", note: "主語 the report が『書く側』になってしまう", appliedMeaning: "「レポートが（自ら）書かなければならない」という擬人化された非文法的な意味になる" },
        { key: "C", text: "is writing", correct: false, reasonCode: "V_VOICE", note: "能動の進行で the report が主語だと成立しない", appliedMeaning: "「レポートが書いている最中だ」という不自然な意味になる" },
        { key: "D", text: "has written", correct: false, reasonCode: "V_VOICE", note: "能動の現在完了、主語と態が合わない", appliedMeaning: "「レポートが（何かを）書き終えた」という擬人化された意味になる" }
      ]
    },
    {
      id: 6, tag: "V-MOD-DYN", sceneTag: "寮生活", functionTag: "情報を得る",
      contextEn: "She grew up playing piano since age five.",
      ja: "彼女はピアノをとても上手に弾ける。",
      template: "She ___ play the piano very well.",
      poolUsed: ["can", "could", "will", "may"],
      options: [
        { key: "A", text: "can", correct: true, reasonCode: null, note: null, appliedMeaning: null },
        { key: "B", text: "could", correct: false, reasonCode: "V_MOD_TENSE_MISMATCH", note: "過去の能力・または控えめな仮定に聞こえる", appliedMeaning: "「昔は弾けた（今は不明）」または「弾けるかもしれない」という距離感の意味になる" },
        { key: "C", text: "will", correct: false, reasonCode: "V_MOD_SENSE_MISMATCH", note: "未来の予測になり、現在の能力を表せない", appliedMeaning: "「将来ピアノを弾くだろう」という未来予測の意味になる" },
        { key: "D", text: "may", correct: false, reasonCode: "V_MOD_TOO_WEAK", note: "許可・弱い可能性で、能力の意味にならない", appliedMeaning: "「弾いてもよい／弾くかもしれない」という許可か半々の可能性の意味になる" }
      ]
    },
    {
      id: 7, tag: "V-MOD-DEO", sceneTag: "空港", functionTag: "理由・目的を問う",
      contextEn: "She is about to miss tonight's flight because of the traffic.",
      ja: "彼女は今すぐ空港へ向かわなければならない。",
      template: "She ___ go to the airport now.",
      poolUsed: ["have to", "must", "should", "may"],
      options: [
        { key: "A", text: "has to", correct: true, reasonCode: null, note: null, appliedMeaning: null },
        { key: "B", text: "must", correct: false, reasonCode: "V_MOD_SOURCE_MISMATCH", note: "外部事情ではなく話者の主観的な必要性に聞こえる", appliedMeaning: "話者が「絶対に必要だ」と個人的に強く思っている、という意味になる" },
        { key: "C", text: "should", correct: false, reasonCode: "V_MOD_TOO_WEAK", note: "助言レベルで、緊急の必要性が伝わらない", appliedMeaning: "「そうした方がいいよ」という助言程度の弱さになる" },
        { key: "D", text: "may", correct: false, reasonCode: "V_MOD_SENSE_MISMATCH", note: "許可・可能性の意味になり、必要性が伝わらない", appliedMeaning: "「行ってもよい（許可）」という意味に変わってしまう" }
      ]
    },
    {
      id: 8, tag: "M-AGR", sceneTag: "家庭", functionTag: "確認する",
      contextEn: null,
      ja: "棚の上の本たちは私のものだ。",
      template: "The books on the shelf ___ mine.",
      options: [
        { key: "A", text: "are", correct: true, reasonCode: null, note: null, appliedMeaning: null },
        { key: "B", text: "is", correct: false, reasonCode: "M_AGR_NUMBER", note: "主語の核 books（複数）と一致しない", appliedMeaning: "文法的に非文法（on the shelf は修飾句で主語の核ではない）" },
        { key: "C", text: "was", correct: false, reasonCode: "M_AGR_NUMBER", note: "数の不一致に加え、過去時制へずれている", appliedMeaning: "「私のものだった」と過去のことになり、現在の所有を表せない" },
        { key: "D", text: "were", correct: false, reasonCode: "V_TENSE", note: "数は合うが時制が過去", appliedMeaning: "「私のものだった」と過去のことになる" }
      ]
    },
    {
      id: 9, tag: "M-PRON-CASE", sceneTag: "レストラン", functionTag: "確認する",
      contextEn: "Tom sat next to Sarah at dinner.",
      ja: "サラは彼にワインを注いだ。",
      template: "Sarah poured wine for ___.",
      options: [
        { key: "A", text: "him", correct: true, reasonCode: null, note: null, appliedMeaning: null },
        { key: "B", text: "he", correct: false, reasonCode: "M_PRON_CASE", note: "前置詞 for の後ろは目的格", appliedMeaning: "非文法（主格は主語の位置でのみ使う）" },
        { key: "C", text: "his", correct: false, reasonCode: "M_PRON_CASE", note: "所有格は名詞の前で使う", appliedMeaning: "「彼のワイン」という意味の断片になり、文が完結しない" },
        { key: "D", text: "himself", correct: false, reasonCode: "M_PRON_CASE", note: "再帰代名詞は主語と同一の対象を指す", appliedMeaning: "「サラは彼自身（＝サラ自身が彼になったかのように）にワインを注いだ」という不自然な意味になる" }
      ]
    },
    {
      id: 10, tag: "M-SEQ", sceneTag: "キャリア", functionTag: "情報を得る",
      contextEn: null,
      ja: "彼は明日来ると言った。",
      template: "He said he ___ come the next day.",
      options: [
        { key: "A", text: "would", correct: true, reasonCode: null, note: null, appliedMeaning: null },
        { key: "B", text: "will", correct: false, reasonCode: "M_SEQ_TENSE", note: "主節が過去（said）なので従属節も過去にずらす", appliedMeaning: "現在から見た未来予測に聞こえ、時制の整合が取れない" },
        { key: "C", text: "comes", correct: false, reasonCode: "M_SEQ_TENSE", note: "現在形は主節の過去と一致しない", appliedMeaning: "「彼は普段来る、と言った」という習慣の意味に取られてしまう" },
        { key: "D", text: "came", correct: false, reasonCode: "V_ASPECT", note: "単純過去だと未来の意味を持たない", appliedMeaning: "「彼は翌日に来た、と言った」という完了済みの意味になる" }
      ]
    }
  ]
};

// ============================================================
// reasonCode → template lookup
// ============================================================
const REASON_TEMPLATES = {
  N_DEF_NEW: "初出・聞き手が特定できないので the は使えない",
  N_DEF_NEEDED: "既出／文脈で一意に決まるので the が必要",
  N_NUM_SG: "1つのものなので単数形",
  N_NUM_PL: "複数のものなので -s が必要",
  N_A_PLURAL: "a は複数形と結合できない",
  N_UNCOUNTABLE: "不可算名詞なので a / -s は付かない",
  N_QNT_MISMATCH: "数量詞が可算・不可算と対応していない",
  V_TENSE: "文中の時の表現と時制が合わない",
  V_ASPECT: "相（進行・完了）の選択が文脈と合わない",
  V_VOICE: "主語が動作をする側か受ける側かが逆",
  V_MOD_TOO_WEAK: "確信・強さが場面に対して弱すぎる",
  V_MOD_TOO_STRONG: "確信・強さが場面に対して強すぎる",
  V_MOD_TENSE_MISMATCH: "時間軸（過去・現在・未来）がずれている",
  V_MOD_SOURCE_MISMATCH: "話者主観の必要性か外部事情の必要性かが逆",
  V_MOD_SENSE_MISMATCH: "能力・許可・可能性のどれを言いたいかが噛み合っていない",
  V_MOD_REGISTER_MISMATCH: "場面に対して堅すぎる／砕けすぎる言い方",
  M_AGR_NUMBER: "主語の核の数と動詞が一致していない",
  M_AGR_PERSON: "主語の人称と動詞が一致していない",
  M_PRON_NUM: "先行詞の数と代名詞が一致していない",
  M_PRON_CASE: "代名詞の格（主格・目的格・所有格）が違う",
  M_SEQ_TENSE: "主節が過去なので従属節も過去へずらす"
};

// ============================================================
// Tag metadata for UI
// ============================================================
const TAG_META = {
  "N-NP": { name: "冠詞と単複", cat: "N" },
  "N-UNC": { name: "可算・不可算", cat: "N" },
  "N-QNT": { name: "数量の表し方", cat: "N" },
  "V-TA": { name: "時制と相", cat: "V" },
  "V-VOICE": { name: "能動・受動", cat: "V" },
  "V-MOD-DYN": { name: "できる・だろうの言い方", cat: "V" },
  "V-MOD-DEO": { name: "しなければ・すべきの言い方", cat: "V" },
  "M-AGR": { name: "主語と動詞の一致", cat: "M" },
  "M-PRON-NUM": { name: "代名詞の数", cat: "M" },
  "M-PRON-CASE": { name: "代名詞の格", cat: "M" },
  "M-SEQ": { name: "時制の一致", cat: "M" }
};

const CATEGORIES = {
  N: "名詞のかたち",
  V: "動詞のかたち",
  M: "整合"
};

const PRESETS = [
  { id: "mix", name: "ミックス診断", desc: "全12タグから均等抽選", tags: Object.keys(TAG_META) },
  { id: "noun", name: "名詞まわり", desc: "冠詞・単複・数量", tags: ["N-NP","N-UNC","N-QNT"] },
  { id: "verb-form", name: "動詞の形", desc: "時制・相・態", tags: ["V-TA","V-VOICE"] },
  { id: "modal", name: "助動詞のニュアンス", desc: "can/must/have to など", tags: ["V-MOD-DYN","V-MOD-DEO"] },
  { id: "agree", name: "一致", desc: "主語・代名詞・時制の照応", tags: ["M-AGR","M-PRON-NUM","M-PRON-CASE","M-SEQ"] }
];

// ============================================================
// State
// ============================================================
let state = {
  screen: "setup",
  preset: "mix",
  set: null,
  currentIdx: 0,
  answers: [], // array of picked keys
  reviewed: [] // array of booleans
};

// ============================================================
// Render
// ============================================================
const $app = document.getElementById("app");

function render() {
  if (state.screen === "setup") renderSetup();
  else if (state.screen === "loading") renderLoading();
  else if (state.screen === "question") renderQuestion();
  else if (state.screen === "result") renderResult();
}

function renderSetup() {
  const preset = PRESETS.find(p => p.id === state.preset);
  const tagNames = preset.tags.map(t => TAG_META[t].name).join("・");

  $app.innerHTML = `
    <header class="top">
      <div class="brand">Marker Trainer — prototype</div>
      <div class="brand-name">英語マーカー感度トレーナー</div>
      <div class="brand-sub">冠詞・単複・時制・助動詞などの判別感度を10問で測る</div>
    </header>
    <div class="screen">
      <div class="setup-section">
        <h2>プリセット</h2>
        <div class="preset-grid">
          ${PRESETS.map(p => `
            <button class="preset-btn ${p.id === state.preset ? 'active' : ''}" data-preset="${p.id}">
              ${p.name}
              <small>${p.desc}</small>
            </button>
          `).join("")}
        </div>
        <div class="tags-detail">
          <span class="cat">対象タグ：</span>${tagNames}
        </div>
        <div class="idiom-note">
          慣用句・定型表現（Would you like ~? / May I help you? など）は本アプリでは扱いません。別アプリで学習してください。
        </div>
      </div>
      <button class="primary-btn" id="startBtn">10問を生成する</button>
    </div>
  `;

  document.querySelectorAll(".preset-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      state.preset = btn.dataset.preset;
      render();
    });
  });

  document.getElementById("startBtn").addEventListener("click", startSession);
}

function renderLoading() {
  $app.innerHTML = `
    <header class="top">
      <div class="brand">Marker Trainer — prototype</div>
      <div class="brand-name">生成中…</div>
      <div class="brand-sub">10問を用意しています</div>
    </header>
  `;
}

function startSession() {
  state.screen = "loading";
  state.set = MOCK_SET;
  state.currentIdx = 0;
  state.answers = new Array(10).fill(null);
  state.reviewed = new Array(10).fill(false);
  render();
  setTimeout(() => {
    state.screen = "question";
    render();
  }, 600);
}

function renderQuestion() {
  const idx = state.currentIdx;
  const item = state.set.items[idx];
  const reviewed = state.reviewed[idx];
  const picked = state.answers[idx];
  const progressPct = ((idx + (reviewed ? 1 : 0)) / 10) * 100;

  $app.innerHTML = `
    <header class="top">
      <div class="brand">Marker Trainer — prototype</div>
    </header>
    <div class="screen">
      <div class="progress">
        <span class="tag-chip">${TAG_META[item.tag]?.name || item.tag} · ${item.sceneTag}</span>
        <span class="progress-count">${idx + 1} / 10</span>
      </div>
      <div class="progress-bar"><div class="progress-bar-fill" style="width: ${progressPct}%"></div></div>

      ${item.contextEn ? `
        <div class="context-en">
          <span class="context-label">Context</span>
          ${item.contextEn}
        </div>
      ` : ""}

      <div class="ja-sentence">${item.ja}</div>
      <div class="en-template">${item.template.replace("___", '<span class="blank">___</span>')}</div>

      <div class="options">
        ${item.options.map(opt => renderOption(opt, reviewed, picked)).join("")}
      </div>

      ${reviewed ? `
        <div class="next-bar">
          <button class="primary-btn" id="nextBtn">
            ${idx === 9 ? "結果を見る" : "次の問題へ"}
          </button>
        </div>
      ` : ""}
    </div>
  `;

  if (!reviewed) {
    document.querySelectorAll(".option-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        state.answers[idx] = btn.dataset.key;
        state.reviewed[idx] = true;
        render();
      });
    });
  } else {
    document.getElementById("nextBtn").addEventListener("click", () => {
      if (idx === 9) {
        state.screen = "result";
      } else {
        state.currentIdx++;
      }
      render();
      window.scrollTo(0, 0);
    });
  }
}

function renderOption(opt, reviewed, picked) {
  if (!reviewed) {
    return `
      <button class="option-btn" data-key="${opt.key}">
        <span class="option-key">${opt.key}</span>
        <span class="option-text">${opt.text}</span>
      </button>
    `;
  }

  const isCorrect = opt.correct;
  const isPicked = opt.key === picked;
  let cls = "option-btn reviewed ";
  if (isCorrect && isPicked) cls += "correct-picked";
  else if (isCorrect) cls += "correct";
  else if (isPicked) cls += "wrong-picked";
  else cls += "wrong";

  const badge = isCorrect
    ? `<div class="badge correct">✓</div>`
    : `<div class="badge wrong">✕</div>`;

  const reasonText = opt.reasonCode ? REASON_TEMPLATES[opt.reasonCode] : null;

  return `
    <div class="${cls}">
      <div class="review-header">
        ${badge}
        <span class="option-key">${opt.key}</span>
        <span class="option-text" style="font-family: var(--font-en); font-size: 16px; font-weight: 500;">${opt.text}</span>
      </div>
      ${!isCorrect ? `
        <div class="review-body">
          ${reasonText ? `<div class="review-reason"><strong>なぜ不正解か</strong>${reasonText}</div>` : ""}
          ${opt.note ? `<div class="review-note">${opt.note}</div>` : ""}
          ${opt.appliedMeaning ? `
            <div class="review-applied">
              <strong>この語を選ぶと</strong>${opt.appliedMeaning}
            </div>
          ` : ""}
        </div>
      ` : `
        <div class="review-body">
          <div class="review-reason" style="color: var(--correct); font-weight: 600;">正解</div>
        </div>
      `}
    </div>
  `;
}

function renderResult() {
  const items = state.set.items;
  const scoresByCat = {};
  const scoresByTag = {};

  items.forEach((item, i) => {
    const cat = TAG_META[item.tag]?.cat || "?";
    const tag = item.tag;
    const correct = items[i].options.find(o => o.key === state.answers[i])?.correct || false;

    if (!scoresByCat[cat]) scoresByCat[cat] = { correct: 0, total: 0 };
    scoresByCat[cat].correct += correct ? 1 : 0;
    scoresByCat[cat].total++;

    if (!scoresByTag[tag]) scoresByTag[tag] = { correct: 0, total: 0 };
    scoresByTag[tag].correct += correct ? 1 : 0;
    scoresByTag[tag].total++;
  });

  const totalCorrect = items.filter((_, i) =>
    items[i].options.find(o => o.key === state.answers[i])?.correct
  ).length;

  $app.innerHTML = `
    <header class="top">
      <div class="brand">Marker Trainer — prototype</div>
      <div class="brand-name">結果</div>
    </header>
    <div class="screen">
      <div class="result-summary">
        <div class="result-label">今回のスコア</div>
        <div>
          <span class="result-score">${totalCorrect}</span>
          <span class="result-score-total">/ 10</span>
        </div>
      </div>

      <div id="categories">
        ${Object.entries(scoresByCat).map(([cat, s]) => {
          const pct = Math.round((s.correct / s.total) * 100);
          const tags = Object.entries(scoresByTag).filter(([t]) => TAG_META[t]?.cat === cat);
          return `
            <div class="category" data-cat="${cat}">
              <div class="category-head">
                <div class="category-name">${CATEGORIES[cat]}</div>
                <div class="category-bar"><div class="category-bar-fill" style="width: ${pct}%"></div></div>
                <div class="category-score">${s.correct}/${s.total}</div>
                <div class="category-caret">▼</div>
              </div>
              <div class="category-detail">
                ${tags.map(([tag, ts]) => `
                  <div class="tag-row">
                    <span class="tag-name">${TAG_META[tag].name}</span>
                    <span class="tag-score">${ts.correct}/${ts.total}</span>
                  </div>
                `).join("")}
              </div>
            </div>
          `;
        }).join("")}
      </div>

      <div class="action-bar">
        <button class="secondary-btn" id="exportBtn">MDエクスポート</button>
        <button class="secondary-btn" id="restartBtn">もう一度</button>
      </div>
    </div>
  `;

  document.querySelectorAll(".category-head").forEach(head => {
    head.addEventListener("click", () => {
      head.parentElement.classList.toggle("open");
    });
  });

  document.getElementById("exportBtn").addEventListener("click", showExportModal);
  document.getElementById("restartBtn").addEventListener("click", () => {
    state.screen = "setup";
    state.set = null;
    state.currentIdx = 0;
    state.answers = [];
    state.reviewed = [];
    render();
  });
}

function showExportModal() {
  const md = buildExportMd();
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal">
      <h3>Claude Projects 貼り付け用</h3>
      <p style="font-size: 12px; color: var(--ink-muted); margin-bottom: 12px;">
        全10問の appliedMeaning が含まれています。Claude Projects で意味の妥当性を検証してください。
      </p>
      <textarea readonly>${md}</textarea>
      <div class="modal-actions">
        <button class="secondary-btn" id="copyBtn" style="flex: 0 0 auto;">コピー</button>
        <button class="secondary-btn" id="closeBtn" style="flex: 0 0 auto;">閉じる</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  document.getElementById("copyBtn").addEventListener("click", () => {
    const ta = overlay.querySelector("textarea");
    ta.select();
    document.execCommand("copy");
    document.getElementById("copyBtn").textContent = "コピーしました";
  });
  document.getElementById("closeBtn").addEventListener("click", () => {
    overlay.remove();
  });
  overlay.addEventListener("click", (e) => {
    if (e.target === overlay) overlay.remove();
  });
}

function buildExportMd() {
  const items = state.set.items;
  const lines = [
    `# Marker Trainer セット (${state.set.generatedAt.slice(0,10)})`,
    `プリセット: ${state.set.preset}`,
    ""
  ];
  items.forEach((item, i) => {
    const picked = state.answers[i];
    const pickedOpt = item.options.find(o => o.key === picked);
    const correctOpt = item.options.find(o => o.correct);
    lines.push(`## 問 ${i+1} [${item.tag}] — ${item.sceneTag}`);
    if (item.contextEn) lines.push(`Context: ${item.contextEn}`);
    lines.push(`日本語: ${item.ja}`);
    lines.push(`英訳: ${item.template}`);
    lines.push(``);
    lines.push(`- 正解: **${correctOpt.text}** (${correctOpt.key})`);
    lines.push(`- あなたの回答: ${pickedOpt.text} ${pickedOpt.correct ? '✓' : '✕'}`);
    lines.push(``);
    lines.push(`### 全選択肢の意味`);
    item.options.forEach(opt => {
      lines.push(`- **${opt.key} ${opt.text}** ${opt.correct ? '(正解)' : ''}`);
      if (!opt.correct) {
        const reason = REASON_TEMPLATES[opt.reasonCode] || opt.reasonCode;
        lines.push(`  - 理由: ${reason}`);
        if (opt.note) lines.push(`  - 補足: ${opt.note}`);
        if (opt.appliedMeaning) lines.push(`  - この語を選ぶと: ${opt.appliedMeaning}`);
      }
    });
    lines.push(``);
    lines.push(`> Claudeへの確認依頼: 上記 appliedMeaning（「この語を選ぶと」）の意味の記述は、実際にネイティブがその選択肢を使ったときに聞き取る意味として妥当ですか。ズレがあれば指摘してください。`);
    lines.push(``);
    lines.push(`---`);
    lines.push(``);
  });
  return lines.join("\n");
}

// ============================================================
// Boot
// ============================================================
render();
</script>
</body>
</html>
